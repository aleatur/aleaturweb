name: Bug report
description: Report a reproducible problem with the Aleatur landing.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping us improve the site.

  - type: textarea
    id: current-behavior
    attributes:
      label: What happened?
      description: Describe the problem and where you saw it.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include the page, actions, and any relevant URL.
      placeholder: |
        1. Open...
        2. Select...
        3. See...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android, Safari on iPhone, etc.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots or other useful details. Do not include private information.
