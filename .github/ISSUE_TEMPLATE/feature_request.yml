name: Feature request
description: Suggest an improvement for the Aleatur site.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the need before describing a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful improvement.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any other approach you considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add references or mockups. Do not include private information.
